name: Crear APK y publicar web
on:
  push:
    branches: [main]
    paths-ignore: ['apk/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Preparar la web para la app
        run: |
          mkdir www
          cp -r index.html app.js style.css sw.js manifest.webmanifest icon-192.png icon-512.png videos www/

      - run: npm install

      - run: npx cap add android

      - name: Permisos de camara y microfono
        run: |
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.CAMERA"/><uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/><uses-feature android:name="android.hardware.camera" android:required="false"/></manifest>#' android/app/src/main/AndroidManifest.xml

      - name: Icono
        continue-on-error: true
        run: npx --yes @capacitor/assets generate --android --assetPath assets --iconBackgroundColor '#0f1520' --iconBackgroundColorDark '#0f1520'

      - run: npx cap sync android

      - name: Compilar APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Guardar la APK en la carpeta apk
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/VideoChatPro.apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add apk/VideoChatPro.apk
          git commit -m "APK actualizada" || echo "Sin cambios"
          git pull --rebase origin main
          git push origin HEAD:main
