name: Compilar APK
on: { push: { branches: [main] }, workflow_dispatch: }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npx cap add android
      - name: Permisos de cámara y micrófono
        run: |
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.CAMERA"/><uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/><uses-feature android:name="android.hardware.camera" android:required="false"/></manifest>#' android/app/src/main/AndroidManifest.xml
      - name: Icono
        continue-on-error: true
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#0f1520' --iconBackgroundColorDark '#0f1520'
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: VideoChatPro-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
